name: Kaggle Formal Temporary

on:
  pull_request:
    paths:
      - ".github/workflows/kaggle-formal-temporary.yml"

concurrency:
  group: kaggle-formal-s6e8-catboost-exactcat-budget-lattice-reflabel-v1
  cancel-in-progress: false

jobs:
  train:
    name: catboost_exactcat_budget_lattice_reflabel_v1
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      S6E8_GIT_COMMIT: ${{ github.sha }}
      S6E8_GIT_REPO: https://github.com/${{ github.repository }}.git
      INPUT_CONFIG: configs/catboost_exactcat_budget_lattice_reflabel_v1.yaml
      INPUT_ACCELERATOR: gpu
      INPUT_KERNEL_SLUG: s6e8-catboost-exactcat-budget-lattice-reflabel-v1
      INPUT_GPU_SHAPE: NvidiaTeslaT4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install orchestration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "kaggle>=1.8" pyyaml pandas numpy pyarrow scikit-learn lightgbm

      - name: Configure Kaggle credentials
        id: auth
        run: python scripts/setup_kaggle_auth.py

      - name: Prepare Kaggle kernel
        id: prepare
        env:
          KAGGLE_USERNAME: ${{ steps.auth.outputs.kaggle_username }}
        run: |
          python scripts/prepare_kaggle_kernel.py \
            --config "$INPUT_CONFIG" \
            --accelerator "$INPUT_ACCELERATOR" \
            --username "${{ steps.auth.outputs.kaggle_username }}" \
            --slug "$INPUT_KERNEL_SLUG" \
            --git-commit "$S6E8_GIT_COMMIT" \
            --git-repo "$S6E8_GIT_REPO" \
            --gpu-machine-shape "$INPUT_GPU_SHAPE"

      - name: Push kernel to Kaggle
        id: push
        working-directory: .kernel-staging
        run: kaggle kernels push -p . --accelerator "$INPUT_GPU_SHAPE"

      - name: Wait for kernel
        id: wait
        run: |
          python scripts/wait_kaggle_kernel.py \
            "${{ steps.prepare.outputs.kernel_id }}" \
            --interval 30 \
            --timeout 14400

      - name: Download kernel output
        id: download
        if: always() && steps.push.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p artifacts/kaggle-output
          kaggle kernels output \
            "${{ steps.prepare.outputs.kernel_id }}" \
            -p artifacts/kaggle-output
          find artifacts/kaggle-output -type f | sort

      - name: Validate formal artifacts
        env:
          EXPERIMENT: catboost_exactcat_budget_lattice_reflabel_v1
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import numpy as np
          import pandas as pd

          exp = os.environ["EXPERIMENT"]
          root = Path("artifacts/kaggle-output/oof") / exp
          metrics = json.loads((root / "metrics.json").read_text(encoding="utf-8"))
          oof = pd.read_parquet(root / "oof_predictions.parquet")
          test = pd.read_parquet(root / "test_predictions.parquet")
          assert len(oof) == metrics["n_train"] == 691_369
          assert len(test) == metrics["n_test"] == 296_302
          assert oof["id"].is_unique and test["id"].is_unique
          assert oof["fold"].notna().all()
          assert set(oof["fold"].unique()) == {0, 1, 2, 3, 4}
          assert np.isfinite(oof["pred"]).all() and np.isfinite(test["pred"]).all()
          assert metrics["n_splits"] == 5
          assert metrics["git_commit"] == os.environ["S6E8_GIT_COMMIT"]
          assert metrics["dependency_versions"]["catboost"]
          provenance = metrics["data_provenance"]
          expected_filename = "Smartphone_Usage_And_Addiction_Analysis_7500_Rows.csv"
          expected_legacy = (
              "/kaggle/input/smartphone-usage-and-addiction-prediction/"
              + expected_filename
          )
          expected_typed = (
              "/kaggle/input/datasets/jayjoshi37/"
              "smartphone-usage-and-addiction-prediction/"
              + expected_filename
          )
          assert provenance["sha256"] == (
              "2194ce1946e8559f26780049c8d972857d8378104f2c9ec25ed9ec35409f1074"
          )
          assert provenance["configured_path"] == expected_legacy
          assert provenance["path"] in {expected_legacy, expected_typed}
          assert provenance["dataset_source"] == (
              "jayjoshi37/smartphone-usage-and-addiction-prediction"
          )
          assert provenance["source_url"] == (
              "https://www.kaggle.com/datasets/jayjoshi37/"
              "smartphone-usage-and-addiction-prediction"
          )
          assert provenance["mode"] == "label_aware"
          assert provenance["external_supervision"] is True
          assert provenance["target_column"] == "addicted_label"
          assert provenance["raw_rows"] == 7_500
          assert provenance["unique_rows"] == 7_500
          assert provenance["duplicate_rows_removed"] == 0
          assert 0 <= provenance["query_overlap_rows_removed"] <= 7_500
          assert (
              provenance["unique_rows"]
              - provenance["query_overlap_rows_removed"]
              == provenance["retained_rows"]
          )
          print(json.dumps({
              "experiment": exp,
              "oof_auc": metrics["oof_auc"],
              "fold_scores": metrics["fold_scores"],
              "git_commit": metrics["git_commit"],
              "data_provenance": provenance,
          }, indent=2))
          PY

      - name: Write job summary
        if: always() && steps.prepare.outcome == 'success'
        run: |
          STATUS=error
          if [ "${{ steps.wait.outcome }}" = "success" ]; then STATUS=complete; fi
          python scripts/write_gha_summary.py \
            --output-dir artifacts/kaggle-output \
            --config "$INPUT_CONFIG" \
            --accelerator "$INPUT_ACCELERATOR" \
            --kernel-id "${{ steps.prepare.outputs.kernel_id }}" \
            --status "$STATUS"

      - name: Upload artifacts
        if: always() && steps.download.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-formal-catboost_exactcat_budget_lattice_reflabel_v1-${{ github.run_id }}
          path: artifacts/kaggle-output
          if-no-files-found: error

      - name: Fail if kernel did not complete
        if: always() && steps.push.outcome == 'success' && steps.wait.outcome != 'success'
        run: exit 1
