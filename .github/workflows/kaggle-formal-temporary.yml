name: Kaggle Formal Lookup Transformer

on:
  pull_request:
    paths:
      - ".github/workflows/kaggle-formal-temporary.yml"

concurrency:
  group: kaggle-formal-s6e8-lookup-transformer-v1
  cancel-in-progress: false

jobs:
  train:
    name: lookup_transformer_v1
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      S6E8_GIT_COMMIT: ${{ github.sha }}
      S6E8_GIT_REPO: https://github.com/${{ github.repository }}.git
      INPUT_CONFIG: configs/lookup_transformer_v1.yaml
      INPUT_ACCELERATOR: gpu
      INPUT_KERNEL_SLUG: s6e8-lookup-transformer-v1
      INPUT_GPU_SHAPE: NvidiaTeslaT4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install orchestration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "kaggle>=1.8" pyyaml pandas numpy pyarrow scikit-learn lightgbm

      - name: Configure Kaggle credentials
        id: auth
        run: python scripts/setup_kaggle_auth.py

      - name: Prepare Kaggle kernel
        id: prepare
        env:
          KAGGLE_USERNAME: ${{ steps.auth.outputs.kaggle_username }}
        run: |
          python scripts/prepare_kaggle_kernel.py \
            --config "$INPUT_CONFIG" \
            --accelerator "$INPUT_ACCELERATOR" \
            --username "${{ steps.auth.outputs.kaggle_username }}" \
            --slug "$INPUT_KERNEL_SLUG" \
            --git-commit "$S6E8_GIT_COMMIT" \
            --git-repo "$S6E8_GIT_REPO" \
            --gpu-machine-shape "$INPUT_GPU_SHAPE"

      - name: Validate isolated GPU kernel metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(
              Path(".kernel-staging/kernel-metadata.json").read_text(encoding="utf-8")
          )
          assert metadata["dataset_sources"] == []
          assert metadata["competition_sources"] == ["playground-series-s6e8"]
          assert metadata["enable_gpu"] is True
          assert metadata["enable_tpu"] is False
          assert metadata["machine_shape"] == "NvidiaTeslaT4"
          PY

      - name: Push kernel to Kaggle
        id: push
        working-directory: .kernel-staging
        run: kaggle kernels push -p . --accelerator "$INPUT_GPU_SHAPE"

      - name: Wait for kernel
        id: wait
        run: |
          python scripts/wait_kaggle_kernel.py \
            "${{ steps.prepare.outputs.kernel_id }}" \
            --interval 30 \
            --timeout 14400

      - name: Download kernel output
        id: download
        if: always() && steps.push.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p artifacts/kaggle-output
          kaggle kernels output \
            "${{ steps.prepare.outputs.kernel_id }}" \
            -p artifacts/kaggle-output
          find artifacts/kaggle-output -type f | sort

      - name: Validate formal artifacts
        env:
          EXPERIMENT: lookup_transformer_v1
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import numpy as np
          import pandas as pd
          import yaml

          def assert_predictor_only(value, path="provenance"):
              forbidden = ("target", "label")
              if isinstance(value, dict):
                  for key, nested in value.items():
                      location = f"{path}.{key}"
                      assert not any(word in str(key).casefold() for word in forbidden), location
                      assert_predictor_only(nested, location)
              elif isinstance(value, (list, tuple)):
                  for index, nested in enumerate(value):
                      assert_predictor_only(nested, f"{path}.{index}")
              elif isinstance(value, str):
                  assert not any(word in value.casefold() for word in forbidden), path

          exp = os.environ["EXPERIMENT"]
          config = yaml.safe_load(
              Path(os.environ["INPUT_CONFIG"]).read_text(encoding="utf-8")
          )
          assert config["experiment"]["name"] == exp
          assert config["model"]["name"] == "lookup_transformer"
          assert config["runtime"]["accelerator"] == "gpu"
          assert config["external_reference"]["enabled"] is False
          expected_lookup = config["model"]["lookup_columns"]
          expected_numeric = config["model"]["numeric_token_columns"]
          expected_decimals = config["model"]["decimal_places"]
          forbidden_columns = {
              config["competition"]["id_col"],
              config["competition"]["target"],
          }
          assert expected_numeric[:len(expected_lookup)] == expected_lookup
          assert forbidden_columns.isdisjoint(expected_lookup)
          assert forbidden_columns.isdisjoint(expected_numeric)

          root = Path("artifacts/kaggle-output/oof") / exp
          metrics = json.loads((root / "metrics.json").read_text(encoding="utf-8"))
          experiment = json.loads(
              (root / "experiment.json").read_text(encoding="utf-8")
          )
          oof = pd.read_parquet(root / "oof_predictions.parquet")
          test = pd.read_parquet(root / "test_predictions.parquet")
          assert len(oof) == metrics["n_train"] == 691_369
          assert len(test) == metrics["n_test"] == 296_302
          assert oof["id"].is_unique and test["id"].is_unique
          assert oof["fold"].notna().all()
          assert set(oof["fold"].unique()) == {0, 1, 2, 3, 4}
          assert np.isfinite(oof["pred"]).all() and np.isfinite(test["pred"]).all()
          assert metrics["n_splits"] == 5
          assert metrics["git_commit"] == os.environ["S6E8_GIT_COMMIT"]
          assert experiment["git_commit"] == os.environ["S6E8_GIT_COMMIT"]
          assert metrics["backend"] == "lookup_transformer"
          assert metrics["model_name"] == "lookup_transformer"
          assert metrics["n_features"] == len(expected_numeric)
          assert metrics["feature_names"] == expected_numeric
          assert metrics["n_categorical_features"] == 0
          assert metrics["categorical_feature_names"] == []

          dependencies = metrics["dependency_versions"]
          assert isinstance(dependencies.get("torch"), str)
          assert dependencies["torch"].strip()
          assert "lookup_transformer" not in dependencies
          assert "lookup" not in dependencies
          assert experiment["dependency_versions"] == dependencies

          preprocessing = metrics["preprocessing_provenance"]
          provenance = metrics["data_provenance"]
          assert preprocessing["transductive_predictor_preprocessing"] is True
          assert provenance == {"lookup_preprocessing": preprocessing}
          assert experiment["preprocessing_provenance"] == preprocessing
          assert experiment["data_provenance"] == provenance
          assert preprocessing["lookup_columns"] == expected_lookup
          assert preprocessing["numeric_columns"] == expected_numeric
          assert preprocessing["decimal_places"] == expected_decimals
          assert len(preprocessing["lookup_cardinalities"]) == len(expected_lookup)
          assert all(
              isinstance(size, int) and size >= 2
              for size in preprocessing["lookup_cardinalities"]
          )
          assert set(preprocessing["numeric_medians"]) == set(expected_numeric)
          assert set(preprocessing["numeric_scales"]) == set(expected_numeric)
          assert all(np.isfinite(list(preprocessing["numeric_medians"].values())))
          assert all(np.isfinite(list(preprocessing["numeric_scales"].values())))
          assert_predictor_only(preprocessing)
          assert_predictor_only(provenance, "data_provenance")

          resolved = experiment["resolved_config"]
          assert resolved["model"]["lookup_columns"] == expected_lookup
          assert resolved["model"]["numeric_token_columns"] == expected_numeric
          assert resolved["external_reference"]["enabled"] is False

          fold_scores = metrics["fold_scores"]
          best_iterations = metrics["best_iterations"]
          diagnostics = metrics["fold_diagnostics"]
          max_epochs = int(config["model"]["params"]["epochs"])
          assert len(fold_scores) == len(best_iterations) == len(diagnostics) == 5
          assert np.isfinite(fold_scores).all()
          assert {record["fold"] for record in diagnostics} == {0, 1, 2, 3, 4}
          by_fold = sorted(diagnostics, key=lambda record: record["fold"])
          assert experiment["fold_diagnostics"] == diagnostics
          for fold, record in enumerate(by_fold):
              assert record["seed"] == config["experiment"]["seed"] + fold
              assert record["best_epoch"] == best_iterations[fold]
              assert isinstance(record["best_epoch"], int)
              assert 1 <= record["best_epoch"] <= record["epochs_trained"] <= max_epochs
              assert np.isfinite(record["best_auc"])
              assert np.isfinite(record["auc"])
              assert record["training_rows"] + record["validation_rows"] == 691_369
              assert record["test_rows"] == 296_302

          print(json.dumps({
              "experiment": exp,
              "oof_auc": metrics["oof_auc"],
              "fold_scores": metrics["fold_scores"],
              "git_commit": metrics["git_commit"],
              "torch": dependencies["torch"],
              "best_iterations": best_iterations,
              "preprocessing_provenance": preprocessing,
          }, indent=2))
          PY

      - name: Write job summary
        if: always() && steps.prepare.outcome == 'success'
        run: |
          STATUS=error
          if [ "${{ steps.wait.outcome }}" = "success" ]; then STATUS=complete; fi
          python scripts/write_gha_summary.py \
            --output-dir artifacts/kaggle-output \
            --config "$INPUT_CONFIG" \
            --accelerator "$INPUT_ACCELERATOR" \
            --kernel-id "${{ steps.prepare.outputs.kernel_id }}" \
            --status "$STATUS"

      - name: Upload artifacts
        if: always() && steps.download.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-formal-lookup_transformer_v1-${{ github.run_id }}
          path: artifacts/kaggle-output
          if-no-files-found: error

      - name: Fail if kernel did not complete
        if: always() && steps.push.outcome == 'success' && steps.wait.outcome != 'success'
        run: exit 1
