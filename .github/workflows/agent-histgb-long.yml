name: Agent HistGB Long Experiment (temporary)

on:
  push:
    branches:
      - agent/histgb-nocat-long-v1
    paths:
      - .github/workflows/agent-histgb-long.yml

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      S6E8_GIT_COMMIT: ${{ github.sha }}
      S6E8_GIT_REPO: https://github.com/${{ github.repository }}.git
      EXPERIMENT_CONFIG: configs/histgb_nocat_long_v1.yaml
      KERNEL_SLUG: s6e8-histgb-nocat-long-v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install orchestration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "kaggle>=1.8" pyyaml pandas numpy pyarrow scikit-learn lightgbm

      - name: Configure Kaggle credentials
        id: auth
        run: python scripts/setup_kaggle_auth.py

      - name: Prepare Kaggle kernel
        id: prepare
        run: |
          python scripts/prepare_kaggle_kernel.py \
            --config "$EXPERIMENT_CONFIG" \
            --accelerator cpu \
            --username "${{ steps.auth.outputs.kaggle_username }}" \
            --slug "$KERNEL_SLUG" \
            --git-commit "$S6E8_GIT_COMMIT" \
            --git-repo "$S6E8_GIT_REPO"

      - name: Push kernel
        working-directory: .kernel-staging
        run: kaggle kernels push -p .

      - name: Wait for kernel
        run: |
          python scripts/wait_kaggle_kernel.py \
            "${{ steps.prepare.outputs.kernel_id }}" \
            --interval 30 \
            --timeout 14400

      - name: Download experiment and reference OOF
        run: |
          set -euo pipefail
          mkdir -p artifacts/new artifacts/reference
          kaggle kernels output "${{ steps.prepare.outputs.kernel_id }}" -p artifacts/new
          kaggle kernels output yitiluo/s6e8-lgbm-nocat -p artifacts/reference
          find artifacts -type f | sort

      - name: Upload modeling artifacts
        uses: actions/upload-artifact@v4
        with:
          name: histgb-nocat-long-v1-${{ github.run_id }}
          path: artifacts
          if-no-files-found: error
          retention-days: 7
