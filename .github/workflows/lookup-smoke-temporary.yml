name: Lookup CPU Smoke Temporary

on:
  pull_request:
    paths:
      - ".github/workflows/lookup-smoke-temporary.yml"

jobs:
  smoke:
    name: lookup-transformer-cpu-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install CPU PyTorch
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"

      - name: Run real Lookup CPU smoke
        run: |
          pytest -q \
            tests/test_lookup_transformer.py \
            tests/test_config.py \
            tests/test_smoke_train.py \
            tests/test_cloud_helpers.py \
            tests/test_dependency_versions.py

      - name: Validate configuration and syntax
        run: |
          python scripts/validate_configs.py
          python -m compileall -q s6e8 scripts kaggle
          git diff --check
