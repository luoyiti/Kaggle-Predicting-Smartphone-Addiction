name: Agent Lookup Research

on:
  push:
    branches:
      - agent/histgb-nocat-long-v1
    paths:
      - .github/workflows/agent-lookup-research.yml

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle client
        run: python -m pip install "kaggle>=1.8"
      - name: Configure Kaggle credentials
        run: python scripts/setup_kaggle_auth.py
      - name: Pull public reference sources
        shell: bash
        run: |
          set -u
          mkdir -p research/original research/notebooks
          kaggle datasets download -d jayjoshi37/smartphone-usage-and-addiction-prediction -p research/original --unzip
          pull_kernel() {
            local ref="$1"
            local out="$2"
            mkdir -p "$out"
            kaggle kernels pull "$ref" -p "$out" -m || echo "Could not pull $ref"
          }
          pull_kernel tamerlanomralinov/s6e8-lookup-transformer-insights-lb-0-97041 research/notebooks/lookup
          pull_kernel kodaifukuda0311/s6e8-xgb-the-power-of-exact-value-te-fe research/notebooks/xgb-te-fe
          pull_kernel tomasa2/s6e8-what-moved-the-score-and-what-didn-t research/notebooks/what-moved
          pull_kernel shashwat1729/s6e8-lookup-pair-transformer research/notebooks/lookup-pair
          find research -type f -maxdepth 4 -print | sort
      - name: Upload research bundle
        uses: actions/upload-artifact@v4
        with:
          name: s6e8-lookup-research-${{ github.run_id }}
          path: research
          if-no-files-found: error
          retention-days: 3
