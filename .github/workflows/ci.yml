name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    name: lint-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax check
        run: python -m compileall -q -x '(\.venv|venv)' .

      - name: Train CLI help
        run: python scripts/train.py --help

      - name: EDA CLI help
        run: python scripts/eda.py --help

      - name: Reports index CLI help
        run: python scripts/build_reports_index.py --help

      - name: Reports index is current
        run: python scripts/build_reports_index.py --check

      - name: Validate experiment configs
        run: python scripts/validate_configs.py

      - name: Postprocess CLI help
        run: |
          python scripts/blend_oof.py --help
          python scripts/stack_oof.py --help
          python scripts/calibrate_oof.py --help
          python scripts/promote.py --help
          python scripts/audit_data.py --help
          python scripts/error_analysis.py --help
          python scripts/eval_slices.py --help

      - name: Import smoke
        run: python -c "import s6e8, s6e8.calibration, s6e8.contracts, s6e8.data, s6e8.data_audit, s6e8.eda, s6e8.eda_report, s6e8.ensemble, s6e8.error_analysis, s6e8.features, s6e8.metrics, s6e8.models.train, s6e8.oof_io, s6e8.promotion, s6e8.reports_index, s6e8.runtime, s6e8.target_encoding"

      - name: Pytest
        run: python -m pytest -q
