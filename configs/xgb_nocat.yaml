experiment:
  name: xgb_nocat
  seed: 42
  data_version: v1
  feature_version: nocat_v1
  model_version: xgb_v1
  primary_variable: model.name
  hypothesis: >
    xgb_raw lost ~0.002 to LGBM on 80k with cats kept. Same nocat columns as
    the Kernel winner may be a better third GBDT family for stacking.
  change: lgbm_nocat feature set; model.name xgboost (CPU hist unless accelerator=gpu).
  expected_effect: Slightly below LightGBM; useful if OOF corr << 0.99.

runtime:
  accelerator: cpu
  enable_internet: true

competition:
  slug: playground-series-s6e8
  task: binary_classification
  target: addicted_label
  id_col: id
  metric: roc_auc
  positive_class: 1

paths:
  train: data/raw/train.csv
  test: data/raw/test.csv
  sample_submission: data/raw/sample_submission.csv
  oof_dir: oof
  submission_dir: submissions

cv:
  type: stratified
  n_splits: 5
  shuffle: true

features:
  numeric:
    - age
    - daily_screen_time_hours
    - social_media_hours
    - gaming_hours
    - work_study_hours
    - sleep_hours
    - notifications_per_day
    - app_opens_per_day
    - weekend_screen_time
  categorical:
    - gender
    - stress_level
    - academic_work_impact
  drop:
    - gender
    - stress_level
    - academic_work_impact
  engineering:
    add_n_missing: false
    add_missing_indicators: false
    add_leisure_hours: false
    add_screen_sleep_ratio: false
    add_weekend_weekday_ratio: false
    add_notif_per_open: false
    ratio_eps: 1.0e-6

model:
  name: xgboost
  num_boost_round: 5000
  early_stopping_rounds: 100
  log_evaluation: 100
  params:
    objective: binary:logistic
    eval_metric: auc
    learning_rate: 0.05
    max_depth: 6
    min_child_weight: 50
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0
    tree_method: hist
    verbosity: 0

output:
  save_oof: true
  save_test: true
  save_submission: true
  dtype: float64
