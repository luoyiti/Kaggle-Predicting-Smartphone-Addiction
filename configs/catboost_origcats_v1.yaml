runtime:
  accelerator: cpu
  enable_internet: true
competition:
  slug: playground-series-s6e8
  task: binary_classification
  target: addicted_label
  id_col: id
  metric: roc_auc
  positive_class: 1
paths:
  train: data/raw/train.csv
  test: data/raw/test.csv
  sample_submission: data/raw/sample_submission.csv
  oof_dir: oof
  submission_dir: submissions
cv:
  type: stratified
  n_splits: 5
  shuffle: true
output:
  save_oof: true
  save_test: true
  save_submission: true
  dtype: float64
experiment:
  name: catboost_origcats_v1
  seed: 42
  data_version: v1
  feature_version: raw_v1
  model_version: catboost_v1
  hypothesis: LGBM treats gender/stress/academic as noise. CatBoost ordered stats on the original
    three categoricals might still extract a tiny CTR. Isolates keeping those cats vs catboost_numeric_v1
    (which drops them).
  change: Same as catboost_numeric_v1 but do not drop the three original categoricals.
features:
  numeric:
  - age
  - daily_screen_time_hours
  - social_media_hours
  - gaming_hours
  - work_study_hours
  - sleep_hours
  - notifications_per_day
  - app_opens_per_day
  - weekend_screen_time
  categorical:
  - gender
  - stress_level
  - academic_work_impact
  engineering:
    add_n_missing: false
    add_missing_indicators: false
    add_leisure_hours: false
    add_screen_sleep_ratio: false
    add_weekend_weekday_ratio: false
    add_notif_per_open: false
    ratio_eps: 1.0e-06
  exact_categorical:
    enabled: false
  screen_budget:
    enabled: false
    tolerance: 1.0e-09
  decimal_lattice:
    enabled: false
    columns:
    - daily_screen_time_hours
    - social_media_hours
    - gaming_hours
    - work_study_hours
    - sleep_hours
    - weekend_screen_time
model:
  name: catboost
  num_boost_round: 6000
  early_stopping_rounds: 200
  log_evaluation: 100
  params:
    learning_rate: 0.05
    depth: 8
    l2_leaf_reg: 6.0
    one_hot_max_size: 4
    max_ctr_complexity: 2
    random_strength: 1.0
    allow_writing_files: false
