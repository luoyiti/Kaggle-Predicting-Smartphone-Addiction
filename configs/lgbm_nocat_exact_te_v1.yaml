experiment:
  name: lgbm_nocat_exact_te_v1
  seed: 42
  data_version: v1
  feature_version: nocat_exact_te_v1
  model_version: lgbm_v1
  hypothesis: >
    Playground numerics sit on a tight exact-value grid (hours ≈ 0.01, notif/app
    are integers). Fold-safe exact-value TE should expose identity / generator
    lookup that raw monotonic splits miss. Full-data 5-fold OOF TE vs raw AUC
    gaps: notifications +0.271 (0.49→0.76), app_opens +0.211 (0.54→0.75),
    sleep +0.068, age +0.049, gaming +0.028, work_study +0.020. Skip
    daily/weekend/social (already monotone, Spearman(TE, raw) > 0.90). Keep
    lgbm_nocat model, seed, CV, and the 9 raw numeric columns unchanged.
  change: >
    lgbm_nocat plus fold-safe exact-value TE (smoothing=20, min_count=5,
    LOO on train fold) for notifications_per_day, app_opens_per_day,
    sleep_hours, age, gaming_hours, work_study_hours.

runtime:
  accelerator: cpu
  enable_internet: true

competition:
  slug: playground-series-s6e8
  task: binary_classification
  target: addicted_label
  id_col: id
  metric: roc_auc
  positive_class: 1

paths:
  train: data/raw/train.csv
  test: data/raw/test.csv
  sample_submission: data/raw/sample_submission.csv
  oof_dir: oof
  submission_dir: submissions

cv:
  type: stratified
  n_splits: 5
  shuffle: true

features:
  numeric:
    - age
    - daily_screen_time_hours
    - social_media_hours
    - gaming_hours
    - work_study_hours
    - sleep_hours
    - notifications_per_day
    - app_opens_per_day
    - weekend_screen_time
  categorical:
    - gender
    - stress_level
    - academic_work_impact
  drop:
    - gender
    - stress_level
    - academic_work_impact
  engineering:
    add_n_missing: false
    add_missing_indicators: false
    add_leisure_hours: false
    add_screen_sleep_ratio: false
    add_weekend_weekday_ratio: false
    add_notif_per_open: false
    ratio_eps: 1.0e-6
    exact_target_encoding:
      enabled: true
      smoothing: 20.0
      min_count: 5
      round_decimals: 2
      leave_one_out_train: true
      suffix: _exact_te
      columns:
        - notifications_per_day
        - app_opens_per_day
        - sleep_hours
        - age
        - gaming_hours
        - work_study_hours

model:
  name: lightgbm
  num_boost_round: 5000
  early_stopping_rounds: 100
  log_evaluation: 100
  params:
    objective: binary
    metric: auc
    boosting_type: gbdt
    learning_rate: 0.05
    num_leaves: 63
    max_depth: -1
    min_child_samples: 50
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l1: 0.0
    lambda_l2: 1.0
    verbosity: -1
    num_threads: 0

output:
  save_oof: true
  save_test: true
  save_submission: true
  dtype: float64
