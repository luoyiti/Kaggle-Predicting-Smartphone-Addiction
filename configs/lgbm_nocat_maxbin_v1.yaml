experiment:
  name: lgbm_nocat_maxbin_v1
  seed: 42
  data_version: v1
  feature_version: nocat_v1
  model_version: lgbm_maxbin_v1
  hypothesis: >
    Playground identity lives in exact numeric keys. LightGBM default max_bin=255
    merges daily_screen (~1389 distinct) and weekend_screen (~1437 distinct) into
    coarse histogram bins and averages neighbouring per-value positive rates.
    Public 5-fold (kitopl/max-bin) measured +0.0023 OOF when max_bin rose from 255
    to 1439 and flattened thereafter. One variable vs lgbm_nocat: model.params.max_bin.
    This is not CatBoost border_count 128 (a bin *decrease* that was flat/worse).
  change: lgbm_nocat plus model.params.max_bin 2047 (above the 1437 distinct plateau).

runtime:
  accelerator: cpu
  enable_internet: true

competition:
  slug: playground-series-s6e8
  task: binary_classification
  target: addicted_label
  id_col: id
  metric: roc_auc
  positive_class: 1

paths:
  train: data/raw/train.csv
  test: data/raw/test.csv
  sample_submission: data/raw/sample_submission.csv
  oof_dir: oof
  submission_dir: submissions

cv:
  type: stratified
  n_splits: 5
  shuffle: true

features:
  numeric:
    - age
    - daily_screen_time_hours
    - social_media_hours
    - gaming_hours
    - work_study_hours
    - sleep_hours
    - notifications_per_day
    - app_opens_per_day
    - weekend_screen_time
  categorical:
    - gender
    - stress_level
    - academic_work_impact
  drop:
    - gender
    - stress_level
    - academic_work_impact
  engineering:
    add_n_missing: false
    add_missing_indicators: false
    add_leisure_hours: false
    add_screen_sleep_ratio: false
    add_weekend_weekday_ratio: false
    add_notif_per_open: false
    ratio_eps: 1.0e-6

model:
  name: lightgbm
  num_boost_round: 5000
  early_stopping_rounds: 100
  log_evaluation: 100
  params:
    objective: binary
    metric: auc
    boosting_type: gbdt
    learning_rate: 0.05
    num_leaves: 63
    max_depth: -1
    min_child_samples: 50
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l1: 0.0
    lambda_l2: 1.0
    max_bin: 2047
    verbosity: -1
    num_threads: 0

output:
  save_oof: true
  save_test: true
  save_submission: true
  dtype: float64
