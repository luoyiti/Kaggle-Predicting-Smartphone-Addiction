runtime:
  accelerator: cpu
  enable_internet: true
competition:
  slug: playground-series-s6e8
  task: binary_classification
  target: addicted_label
  id_col: id
  metric: roc_auc
  positive_class: 1
paths:
  train: data/raw/train.csv
  test: data/raw/test.csv
  sample_submission: data/raw/sample_submission.csv
  oof_dir: oof
  submission_dir: submissions
cv:
  type: stratified
  n_splits: 5
  shuffle: true
output:
  save_oof: true
  save_test: true
  save_submission: true
  dtype: float64
experiment:
  name: lgbm_exactcat_v1
  seed: 42
  data_version: v1
  feature_version: exactcat_v1
  model_version: lgbm_v1
  hypothesis: If CatBoost CTR on exact copies is the win, LightGBM native categorical splits
    on the same copies should be weaker. Isolates backend cat handling on the exactcat feature
    view.
  change: lgbm_nocat plus features.exact_categorical.enabled; cats passed to LightGBM.
features:
  numeric:
  - age
  - daily_screen_time_hours
  - social_media_hours
  - gaming_hours
  - work_study_hours
  - sleep_hours
  - notifications_per_day
  - app_opens_per_day
  - weekend_screen_time
  categorical:
  - gender
  - stress_level
  - academic_work_impact
  drop:
  - gender
  - stress_level
  - academic_work_impact
  engineering:
    add_n_missing: false
    add_missing_indicators: false
    add_leisure_hours: false
    add_screen_sleep_ratio: false
    add_weekend_weekday_ratio: false
    add_notif_per_open: false
    ratio_eps: 1.0e-06
  exact_categorical:
    enabled: true
    columns: auto_numeric
    suffix: __exact
    missing_token: __MISSING__
    decimal_places:
      age: 0
      daily_screen_time_hours: 2
      social_media_hours: 2
      gaming_hours: 2
      work_study_hours: 2
      sleep_hours: 2
      notifications_per_day: 0
      app_opens_per_day: 0
      weekend_screen_time: 2
  screen_budget:
    enabled: false
    tolerance: 1.0e-09
  decimal_lattice:
    enabled: false
    columns:
    - daily_screen_time_hours
    - social_media_hours
    - gaming_hours
    - work_study_hours
    - sleep_hours
    - weekend_screen_time
model:
  name: lightgbm
  num_boost_round: 5000
  early_stopping_rounds: 100
  log_evaluation: 100
  params:
    objective: binary
    metric: auc
    boosting_type: gbdt
    learning_rate: 0.05
    num_leaves: 63
    max_depth: -1
    min_child_samples: 50
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l1: 0.0
    lambda_l2: 1.0
    verbosity: -1
    num_threads: 0
