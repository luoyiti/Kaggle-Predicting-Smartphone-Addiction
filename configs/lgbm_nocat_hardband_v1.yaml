experiment:
  name: lgbm_nocat_hardband_v1
  seed: 42
  data_version: v1
  feature_version: nocat_hardband_v1
  model_version: lgbm_v1
  hypothesis: >
    lgbm_nocat's hard band (frozen OOF p in (0.3, 0.7), ~13.5% of train, band AUC
    ~0.64) is where ranking is still almost random. A specialist that trains only
    on those rows, using a frozen leak-free OOF mask, may rank the band better
    than the global tree. Overall AUC may fall; the lever is gated blend with
    frozen lgbm_nocat, not a solo replace. One variable vs lgbm_nocat:
    features.hard_band.
  change: lgbm_nocat plus features.hard_band.enabled train_only on frozen lgbm_nocat OOF.

runtime:
  accelerator: cpu
  enable_internet: true

competition:
  slug: playground-series-s6e8
  task: binary_classification
  target: addicted_label
  id_col: id
  metric: roc_auc
  positive_class: 1

paths:
  train: data/raw/train.csv
  test: data/raw/test.csv
  sample_submission: data/raw/sample_submission.csv
  oof_dir: oof
  submission_dir: submissions

cv:
  type: stratified
  n_splits: 5
  shuffle: true

features:
  numeric:
    - age
    - daily_screen_time_hours
    - social_media_hours
    - gaming_hours
    - work_study_hours
    - sleep_hours
    - notifications_per_day
    - app_opens_per_day
    - weekend_screen_time
  categorical:
    - gender
    - stress_level
    - academic_work_impact
  drop:
    - gender
    - stress_level
    - academic_work_impact
  engineering:
    add_n_missing: false
    add_missing_indicators: false
    add_leisure_hours: false
    add_screen_sleep_ratio: false
    add_weekend_weekday_ratio: false
    add_notif_per_open: false
    ratio_eps: 1.0e-6
  hard_band:
    enabled: true
    source_experiment: lgbm_nocat
    pred_col: pred
    lo: 0.3
    hi: 0.7
    mode: train_only
    eval_on: band
    fallback: inner_oof
    min_train_rows: 20
    min_eval_rows: 10

model:
  name: lightgbm
  num_boost_round: 5000
  early_stopping_rounds: 100
  log_evaluation: 100
  params:
    objective: binary
    metric: auc
    boosting_type: gbdt
    learning_rate: 0.05
    num_leaves: 63
    max_depth: -1
    min_child_samples: 50
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l1: 0.0
    lambda_l2: 1.0
    verbosity: -1
    num_threads: 0

output:
  save_oof: true
  save_test: true
  save_submission: true
  dtype: float64
