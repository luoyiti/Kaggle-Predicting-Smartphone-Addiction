runtime:
  accelerator: cpu
  enable_internet: true
competition:
  slug: playground-series-s6e8
  task: binary_classification
  target: addicted_label
  id_col: id
  metric: roc_auc
  positive_class: 1
paths:
  train: data/raw/train.csv
  test: data/raw/test.csv
  sample_submission: data/raw/sample_submission.csv
  oof_dir: oof
  submission_dir: submissions
cv:
  type: stratified
  n_splits: 5
  shuffle: true
output:
  save_oof: true
  save_test: true
  save_submission: true
  dtype: float64
experiment:
  name: logreg_exact_te_v1
  seed: 42
  data_version: v1
  feature_version: nocat_all_te_v1
  model_version: logreg_v1
  hypothesis: logreg_raw was 0.911 and too weak to stack. Fold-safe exact TE of every numeric
    (univariate notif TE AUC 0.76) may turn logistic into a useful identity stacker even if
    it loses to trees solo.
  change: logreg on nocat columns plus fold-safe exact TE of all 9 numerics.
features:
  numeric:
  - age
  - daily_screen_time_hours
  - social_media_hours
  - gaming_hours
  - work_study_hours
  - sleep_hours
  - notifications_per_day
  - app_opens_per_day
  - weekend_screen_time
  categorical:
  - gender
  - stress_level
  - academic_work_impact
  drop:
  - gender
  - stress_level
  - academic_work_impact
  engineering:
    add_n_missing: false
    add_missing_indicators: false
    add_leisure_hours: false
    add_screen_sleep_ratio: false
    add_weekend_weekday_ratio: false
    add_notif_per_open: false
    ratio_eps: 1.0e-06
    exact_target_encoding:
      enabled: true
      smoothing: 20.0
      min_count: 5
      round_decimals: 2
      leave_one_out_train: true
      suffix: _exact_te
      columns:
      - notifications_per_day
      - app_opens_per_day
      - sleep_hours
      - age
      - gaming_hours
      - work_study_hours
      - daily_screen_time_hours
      - social_media_hours
      - weekend_screen_time
model:
  name: logreg
  num_boost_round: 1
  early_stopping_rounds: 1
  params:
    max_iter: 400
    C: 1.0
    solver: lbfgs
