experiment:
  name: histgb_nocat_long_v1
  seed: 42
  data_version: v1
  feature_version: nocat_v1
  model_version: histgb_long_v1
  hypothesis: >
    The full-data histgb_nocat run reached max_iter=500 on every fold while
    remaining 0.00163 AUC behind lgbm_nocat. Extending only the boosting budget
    should reveal whether the gap is undertraining rather than model bias.
  change: >
    histgb_nocat with num_boost_round increased from 500 to 1400 (the trainer
    maps it to HistGB max_iter); features, CV, seed, tree structure,
    regularization, and early stopping are unchanged.

runtime:
  accelerator: cpu
  enable_internet: true

competition:
  slug: playground-series-s6e8
  task: binary_classification
  target: addicted_label
  id_col: id
  metric: roc_auc
  positive_class: 1

paths:
  train: data/raw/train.csv
  test: data/raw/test.csv
  sample_submission: data/raw/sample_submission.csv
  oof_dir: oof
  submission_dir: submissions

cv:
  type: stratified
  n_splits: 5
  shuffle: true

features:
  numeric:
    - age
    - daily_screen_time_hours
    - social_media_hours
    - gaming_hours
    - work_study_hours
    - sleep_hours
    - notifications_per_day
    - app_opens_per_day
    - weekend_screen_time
  categorical:
    - gender
    - stress_level
    - academic_work_impact
  drop:
    - gender
    - stress_level
    - academic_work_impact
  engineering:
    add_n_missing: false
    add_missing_indicators: false
    add_leisure_hours: false
    add_screen_sleep_ratio: false
    add_weekend_weekday_ratio: false
    add_notif_per_open: false
    ratio_eps: 1.0e-6

model:
  name: histgb
  num_boost_round: 1400
  early_stopping_rounds: 30
  params:
    learning_rate: 0.06
    max_depth: 8
    max_leaf_nodes: 63
    min_samples_leaf: 50
    l2_regularization: 1.0
    early_stopping: true
    n_iter_no_change: 30

output:
  save_oof: true
  save_test: true
  save_submission: true
  dtype: float64
