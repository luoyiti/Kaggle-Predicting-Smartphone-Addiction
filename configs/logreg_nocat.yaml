experiment:
  name: logreg_nocat
  seed: 42
  data_version: v1
  feature_version: nocat_missflags_v1
  model_version: logreg_v1
  primary_variable: logreg + missing indicators
  hypothesis: >
    logreg_raw sat at 0.911 because it median-filled missingness. Giving the
    linear model explicit missing flags plus dropped cats tests whether a
    regularized linear stacker input can get closer to trees.
  change: nocat columns + missing indicators; model.name logreg (L2, C=1).
  expected_effect: Still well below GBM; only useful if corr with LGBM is moderate.

runtime:
  accelerator: cpu
  enable_internet: true

competition:
  slug: playground-series-s6e8
  task: binary_classification
  target: addicted_label
  id_col: id
  metric: roc_auc
  positive_class: 1

paths:
  train: data/raw/train.csv
  test: data/raw/test.csv
  sample_submission: data/raw/sample_submission.csv
  oof_dir: oof
  submission_dir: submissions

cv:
  type: stratified
  n_splits: 5
  shuffle: true

features:
  numeric:
    - age
    - daily_screen_time_hours
    - social_media_hours
    - gaming_hours
    - work_study_hours
    - sleep_hours
    - notifications_per_day
    - app_opens_per_day
    - weekend_screen_time
  categorical:
    - gender
    - stress_level
    - academic_work_impact
  drop:
    - gender
    - stress_level
    - academic_work_impact
  engineering:
    add_n_missing: true
    add_missing_indicators: true
    add_leisure_hours: false
    add_screen_sleep_ratio: false
    add_weekend_weekday_ratio: false
    add_notif_per_open: false
    ratio_eps: 1.0e-6

model:
  name: logreg
  num_boost_round: 1
  early_stopping_rounds: 1
  params:
    max_iter: 400
    C: 1.0
    solver: lbfgs

output:
  save_oof: true
  save_test: true
  save_submission: true
  dtype: float64
