kind: promotion
experiment:
  name: promotion_gates
  seed: 42
  hypothesis: Fail closed unless a candidate beats or matches lgbm_nocat OOF.
  change: Default gates for scripts/promote.py
  expected_effect: Blocks diagnostic CSVs and missing artifacts.

promotion:
  baseline_experiment: lgbm_nocat
  min_oof_auc_delta: 0.0
  max_ece: 0.08
  require_ece: false
  min_slice_auc: 0.50
  min_slice_n: 200
  require_slices: false
  require_oof_and_test: true
  fail_closed_on_missing: true
