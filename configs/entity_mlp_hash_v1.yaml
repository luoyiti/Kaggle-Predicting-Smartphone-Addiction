runtime:
  accelerator: cpu
  enable_internet: true
competition:
  slug: playground-series-s6e8
  task: binary_classification
  target: addicted_label
  id_col: id
  metric: roc_auc
  positive_class: 1
paths:
  train: data/raw/train.csv
  test: data/raw/test.csv
  sample_submission: data/raw/sample_submission.csv
  oof_dir: oof
  submission_dir: submissions
cv:
  type: stratified
  n_splits: 5
  shuffle: true
output:
  save_oof: true
  save_test: true
  save_submission: true
  dtype: float64
experiment:
  name: entity_mlp_hash_v1
  seed: 42
  data_version: v1
  feature_version: exactcat_v1
  model_version: entity_mlp_v1
  hypothesis: A small residual MLP with hashed embeddings of exact numeric keys (hashing
    trick, not a per-value lookup table and not attention) may capture playground identity
    without the Lookup-Transformer architecture that failed its solo gate. Optional
    torch; skipped if torch is missing.
  change: model.name entity_mlp plus exact_categorical copies; no transformer / no
    full-vocab lookup.
features:
  numeric:
  - age
  - daily_screen_time_hours
  - social_media_hours
  - gaming_hours
  - work_study_hours
  - sleep_hours
  - notifications_per_day
  - app_opens_per_day
  - weekend_screen_time
  categorical:
  - gender
  - stress_level
  - academic_work_impact
  drop:
  - gender
  - stress_level
  - academic_work_impact
  engineering:
    add_n_missing: false
    add_missing_indicators: false
    add_leisure_hours: false
    add_screen_sleep_ratio: false
    add_weekend_weekday_ratio: false
    add_notif_per_open: false
    ratio_eps: 1.0e-06
  exact_categorical:
    enabled: true
    columns: auto_numeric
    suffix: __exact
    missing_token: __MISSING__
    decimal_places:
      age: 0
      daily_screen_time_hours: 2
      social_media_hours: 2
      gaming_hours: 2
      work_study_hours: 2
      sleep_hours: 2
      notifications_per_day: 0
      app_opens_per_day: 0
      weekend_screen_time: 2
model:
  name: entity_mlp
  num_boost_round: 1
  early_stopping_rounds: 1
  params:
    hidden_dims:
    - 64
    - 32
    embed_dim: 8
    hash_buckets: 256
    dropout: 0.1
    epochs: 12
    batch_size: 4096
    lr: 0.001
    patience: 3
    weight_decay: 0.0001
