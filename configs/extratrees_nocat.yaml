experiment:
  name: extratrees_nocat
  seed: 42
  data_version: v1
  feature_version: nocat_v1
  model_version: extratrees_v1
  primary_variable: model.name
  hypothesis: >
    Completely random split ExtraTrees often disagrees with boosted trees even
    at lower AUC, which is what a stacker needs. Median-impute because sklearn
    ExtraTrees has no native NaN.
  change: lgbm_nocat columns; model.name extratrees. Prefer --max-train-rows first.
  expected_effect: Lower AUC than GBM; only keep if OOF corr with lgbm_nocat < ~0.97.

runtime:
  accelerator: cpu
  enable_internet: true

competition:
  slug: playground-series-s6e8
  task: binary_classification
  target: addicted_label
  id_col: id
  metric: roc_auc
  positive_class: 1

paths:
  train: data/raw/train.csv
  test: data/raw/test.csv
  sample_submission: data/raw/sample_submission.csv
  oof_dir: oof
  submission_dir: submissions

cv:
  type: stratified
  n_splits: 5
  shuffle: true

features:
  numeric:
    - age
    - daily_screen_time_hours
    - social_media_hours
    - gaming_hours
    - work_study_hours
    - sleep_hours
    - notifications_per_day
    - app_opens_per_day
    - weekend_screen_time
  categorical:
    - gender
    - stress_level
    - academic_work_impact
  drop:
    - gender
    - stress_level
    - academic_work_impact
  engineering:
    add_n_missing: false
    add_missing_indicators: false
    add_leisure_hours: false
    add_screen_sleep_ratio: false
    add_weekend_weekday_ratio: false
    add_notif_per_open: false
    ratio_eps: 1.0e-6

model:
  name: extratrees
  num_boost_round: 200
  early_stopping_rounds: 1
  params:
    n_estimators: 200
    max_depth: 12
    min_samples_leaf: 50
    max_features: sqrt
    n_jobs: -1

output:
  save_oof: true
  save_test: true
  save_submission: true
  dtype: float64
