runtime:
  accelerator: cpu
  enable_internet: true
competition:
  slug: playground-series-s6e8
  task: binary_classification
  target: addicted_label
  id_col: id
  metric: roc_auc
  positive_class: 1
paths:
  train: data/raw/train.csv
  test: data/raw/test.csv
  sample_submission: data/raw/sample_submission.csv
  oof_dir: oof
  submission_dir: submissions
cv:
  type: stratified
  n_splits: 5
  shuffle: true
output:
  save_oof: true
  save_test: true
  save_submission: true
  dtype: float64
experiment:
  name: mlp_nocat
  seed: 42
  data_version: v1
  feature_version: nocat_v1
  model_version: mlp_v1
  hypothesis: A shallow sklearn MLP on the nocat numerics may disagree with trees (architecture
    diversity). Public OOF libraries show same-features different architectures still correlate
    ~0.99, so this is a cheap negative-control plus possible tiny blend component.
  change: Same nocat columns as lgbm_nocat; model.name mlp.
features:
  numeric:
  - age
  - daily_screen_time_hours
  - social_media_hours
  - gaming_hours
  - work_study_hours
  - sleep_hours
  - notifications_per_day
  - app_opens_per_day
  - weekend_screen_time
  categorical:
  - gender
  - stress_level
  - academic_work_impact
  drop:
  - gender
  - stress_level
  - academic_work_impact
  engineering:
    add_n_missing: false
    add_missing_indicators: false
    add_leisure_hours: false
    add_screen_sleep_ratio: false
    add_weekend_weekday_ratio: false
    add_notif_per_open: false
    ratio_eps: 1.0e-06
model:
  name: mlp
  num_boost_round: 1
  early_stopping_rounds: 1
  params:
    hidden_layer_sizes:
    - 64
    - 32
    max_iter: 80
    alpha: 0.0001
    learning_rate_init: 0.001
    early_stopping: true
    validation_fraction: 0.1
