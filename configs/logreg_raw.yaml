experiment:
  name: logreg_raw
  seed: 42
  data_version: v1
  feature_version: raw_v1
  model_version: logreg_v1
  hypothesis: >
    If notifications/app_opens matter only through tree interactions, logistic
    regression on raw columns will sit well below GBM (~usage univariate 0.89)
    rather than near 0.95.
  change: Same raw columns as lgbm_raw; model.name logreg with median impute + OHE.

runtime:
  accelerator: cpu
  enable_internet: true

competition:
  slug: playground-series-s6e8
  task: binary_classification
  target: addicted_label
  id_col: id
  metric: roc_auc
  positive_class: 1

paths:
  train: data/raw/train.csv
  test: data/raw/test.csv
  sample_submission: data/raw/sample_submission.csv
  oof_dir: oof
  submission_dir: submissions

cv:
  type: stratified
  n_splits: 5
  shuffle: true

features:
  numeric:
    - age
    - daily_screen_time_hours
    - social_media_hours
    - gaming_hours
    - work_study_hours
    - sleep_hours
    - notifications_per_day
    - app_opens_per_day
    - weekend_screen_time
  categorical:
    - gender
    - stress_level
    - academic_work_impact
  engineering:
    add_n_missing: false
    add_missing_indicators: false
    add_leisure_hours: false
    add_screen_sleep_ratio: false
    add_weekend_weekday_ratio: false
    add_notif_per_open: false
    ratio_eps: 1.0e-6

model:
  name: logreg
  num_boost_round: 1
  early_stopping_rounds: 1
  params:
    max_iter: 400
    C: 1.0
    solver: lbfgs

output:
  save_oof: true
  save_test: true
  save_submission: true
  dtype: float64
